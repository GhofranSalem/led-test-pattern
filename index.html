<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Test Pattern</title>
  <meta name="description" content="مولّد صور اختبار لشاشات الإيفنتات بأي رزلوشن">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>LED Test Pattern</h1>
    <span class="sub">صور اختبار بأي رزلوشن — PNG بدون ضغط</span>
  </header>

  <main class="layout">
    <aside class="panel" id="controls">

      <section>
        <h2>الرزلوشن</h2>
        <div class="row">
          <label>العرض (px)<input type="number" id="w" min="1" step="1" value="1920"></label>
          <label>الارتفاع (px)<input type="number" id="h" min="1" step="1" value="1080"></label>
        </div>
        <div class="row">
          <label class="grow">Presets
            <select id="preset"></select>
          </label>
        </div>
        <div class="row btns">
          <input type="text" id="presetName" class="grow" placeholder="اسم الـ preset (مثلاً: المسرح الرئيسي)" aria-label="اسم الـ preset">
          <button type="button" id="savePreset" class="ghost">حفظ</button>
          <button type="button" id="deletePreset" class="ghost" hidden>حذف الـ preset</button>
        </div>
        <p class="meta" id="meta"></p>
        <p class="warn" id="warn" hidden></p>
      </section>

      <section>
        <h2>
          <label class="check"><input type="checkbox" id="cabOn"> حساب بالكابينات</label>
        </h2>
        <div id="cabFields" class="cab-fields">
          <div class="row">
            <label>عدد الأعمدة<input type="number" id="cabCols" min="1" value="12"></label>
            <label>عدد الصفوف<input type="number" id="cabRows" min="1" value="4"></label>
          </div>
          <div class="row">
            <label>عرض الكابينة (px)<input type="number" id="cabW" min="1" value="128"></label>
            <label>ارتفاع الكابينة (px)<input type="number" id="cabH" min="1" value="128"></label>
          </div>
          <label class="check"><input type="checkbox" id="cabinets" checked> رسم حدود الكابينات وأرقامها</label>
        </div>
      </section>

      <section>
        <h2>الخلفية</h2>
        <div class="seg" id="bgSeg">
          <label><input type="radio" name="bg" value="black" checked><span>أسود</span></label>
          <label><input type="radio" name="bg" value="solid"><span>لون</span></label>
          <label><input type="radio" name="bg" value="bars"><span>Color bars</span></label>
          <label><input type="radio" name="bg" value="gray"><span>تدرج رمادي</span></label>
          <label><input type="radio" name="bg" value="rgb"><span>تدرج RGB</span></label>
        </div>
        <label class="inline" id="solidWrap">لون الخلفية <input type="color" id="solid" value="#1a2440"></label>
      </section>

      <section>
        <h2>العناصر</h2>
        <label class="check"><input type="checkbox" id="grid" checked> Grid كل
          <input type="number" id="gridStep" min="2" value="64" class="tiny"> px</label>
        <label class="check"><input type="checkbox" id="circles" checked> دواير (للتأكد من الـ aspect ratio)</label>
        <label class="check"><input type="checkbox" id="cross" checked> Crosshair وأقطار</label>
        <label class="check"><input type="checkbox" id="border" checked> إطار 1px وأسهم الأركان</label>
        <label class="check"><input type="checkbox" id="info" checked> بيانات الرزلوشن في النص</label>
      </section>

      <section>
        <h2>نص على الصورة</h2>
        <label>اسم الإيفنت<input type="text" id="event" placeholder="مثال: Expo 2026"></label>
        <label>اسم الشاشة<input type="text" id="screen" placeholder="مثال: Main Stage"></label>
      </section>

      <section class="actions">
        <button type="button" id="download" class="primary">تحميل PNG</button>
        <button type="button" id="copyLink" class="ghost">نسخ رابط بنفس الإعدادات</button>
        <h3>ألوان كاملة (Dead pixels / Uniformity)</h3>
        <div class="swatches" id="fields">
          <button type="button" data-color="#ff0000" style="--c:#ff0000" title="Red">R</button>
          <button type="button" data-color="#00ff00" style="--c:#00ff00" title="Green">G</button>
          <button type="button" data-color="#0000ff" style="--c:#0000ff" title="Blue">B</button>
          <button type="button" data-color="#ffffff" style="--c:#ffffff" title="White">W</button>
          <button type="button" data-color="#000000" style="--c:#000000" title="Black">K</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </section>
    </aside>

    <section class="stage">
      <div class="canvas-wrap">
        <canvas id="canvas" dir="ltr" width="1920" height="1080"></canvas>
      </div>
      <p class="hint">المعاينة متصغرة على قد الشاشة. الملف اللي بيتحمّل بالرزلوشن الكامل بالظبط.</p>
    </section>
  </main>

  <script src="pattern.js"></script>
  <script src="app.js"></script>
</body>
</html>
